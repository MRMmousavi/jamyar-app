name: Build and Sign Android Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/jamyar-release-key.jks
               - name: Grant execute permission to gradlew
           run: chmod +x android/gradlew


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK & AAB
        working-directory: android
        run: |
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file=jamyar-release-key.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: jamyar-release-apk
          path: android/app/build/outputs/apk/release/*-release.apk

      - name: Upload Release AAB (Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: jamyar-release-aab
          path: android/app/build/outputs/bundle/release/*-release.aab
